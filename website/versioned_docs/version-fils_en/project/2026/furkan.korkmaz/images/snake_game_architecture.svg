<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Snake Game - STM32 Architecture</title>
  <desc>Button inputs connect to STM32 which processes game logic and outputs via USB gamepad to PC monitor</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Left: Buttons Input -->
  <g class="c-blue">
    <rect x="50" y="130" width="160" height="120" rx="12" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="130" y="165" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#0C447C">Buttons</text>
    <text x="130" y="190" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#185FA5">8x GPIO</text>
    <text x="130" y="210" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#185FA5">Input Pins</text>
  </g>

  <!-- Center: STM32 Processing -->
  <g class="c-purple">
    <rect x="280" y="80" width="220" height="220" rx="12" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="390" y="120" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#3C3489">STM32U545RETx</text>
    <text x="390" y="145" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Game Logic</text>
    <text x="390" y="165" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Button Processing</text>
    <text x="390" y="185" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Score + Lives</text>
    <text x="390" y="205" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Level Management</text>
    <text x="390" y="225" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">USB Output</text>
  </g>

  <!-- Right: USB to PC -->
  <g class="c-teal">
    <rect x="570" y="130" width="160" height="120" rx="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="650" y="165" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#085041">PC Monitor</text>
    <text x="650" y="190" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#0F6E56">USB Gamepad</text>
    <text x="650" y="210" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#0F6E56">Rendering</text>
  </g>

  <!-- Arrows between main components -->
  <line x1="210" y1="190" x2="280" y2="190" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="180" text-anchor="middle" font-size="12px" fill="#185FA5">GPIO read</text>

  <line x1="500" y1="190" x2="570" y2="190" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="180" text-anchor="middle" font-size="12px" fill="#0F6E56">USB HID</text>

  <!-- Optional Bottom Components -->
  <!-- Buzzer Optional -->
  <g opacity="0.5">
    <rect x="120" y="290" width="140" height="50" rx="8" stroke="#888780" stroke-width="0.5" stroke-dasharray="2,2" fill="transparent"/>
    <text x="190" y="320" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#888780">Buzzer (optional)</text>
  </g>

  <!-- Dashed connection from STM32 to Buzzer -->
  <line x1="310" y1="300" x2="260" y2="290" stroke="#888780" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>

  <!-- OLED Optional -->
  <g opacity="0.5">
    <rect x="420" y="290" width="140" height="50" rx="8" stroke="#888780" stroke-width="0.5" stroke-dasharray="2,2" fill="transparent"/>
    <text x="490" y="320" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#888780">OLED (optional)</text>
  </g>

  <!-- Dashed connection from STM32 to OLED -->
  <line x1="470" y1="300" x2="420" y2="290" stroke="#888780" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>

</svg>
