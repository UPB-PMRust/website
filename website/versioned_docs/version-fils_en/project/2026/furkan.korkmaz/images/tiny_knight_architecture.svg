<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Tiny Knight - STM32 Architecture</title>
  <desc>Button inputs to STM32 game engine with player, enemies, physics, and shop systems, output to PC via USB</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Left: Input -->
  <g class="c-blue">
    <rect x="40" y="170" width="140" height="100" rx="12" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="110" y="200" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#0C447C">Buttons</text>
    <text x="110" y="222" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#185FA5">D-Pad + Actions</text>
    <text x="110" y="242" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#185FA5">8x GPIO</text>
  </g>

  <!-- Center Top: Main Processor -->
  <g class="c-purple">
    <rect x="240" y="40" width="200" height="140" rx="12" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="340" y="75" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#3C3489">STM32U545RETx</text>
    <text x="340" y="100" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Core Game Engine</text>
    <text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Level Management</text>
    <text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#534AB7">Entity System</text>
  </g>

  <!-- Player Entity -->
  <g class="c-coral">
    <rect x="240" y="220" width="90" height="90" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
    <text x="285" y="248" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#712B13">Player</text>
    <text x="285" y="268" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">Position</text>
    <text x="285" y="283" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">Health</text>
    <text x="285" y="298" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">Sword</text>
  </g>

  <!-- Enemy System -->
  <g class="c-coral">
    <rect x="350" y="220" width="90" height="90" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
    <text x="395" y="248" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#712B13">Enemies</text>
    <text x="395" y="268" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">AI States</text>
    <text x="395" y="283" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">5 Types</text>
    <text x="395" y="298" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993C1D">Patrol/Chase</text>
  </g>

  <!-- Physics & Collision -->
  <g class="c-pink">
    <rect x="460" y="220" width="90" height="90" rx="8" stroke-width="0.5" fill="#FBEAF0" stroke="#993556"/>
    <text x="505" y="248" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#72243E">Physics</text>
    <text x="505" y="268" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993556">Gravity</text>
    <text x="505" y="283" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993556">Collision</text>
    <text x="505" y="298" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#993556">Platforms</text>
  </g>

  <!-- Coins & Shop -->
  <g class="c-amber">
    <rect x="240" y="340" width="90" height="70" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="285" y="363" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#633806">Shop</text>
    <text x="285" y="383" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#854F0B">Coins</text>
    <text x="285" y="398" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#854F0B">Power-ups</text>
  </g>

  <!-- Level Data -->
  <g class="c-green">
    <rect x="350" y="340" width="90" height="70" rx="8" stroke-width="0.5" fill="#EAF3DE" stroke="#3B6D11"/>
    <text x="395" y="363" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#27500A">Levels</text>
    <text x="395" y="383" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#3B6D11">Platforms</text>
    <text x="395" y="398" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#3B6D11">20 Levels</text>
  </g>

  <!-- Right: Output -->
  <g class="c-teal">
    <rect x="570" y="170" width="140" height="100" rx="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="640" y="200" text-anchor="middle" dominant-baseline="central" font-size="14px" font-weight="500" fill="#085041">PC Monitor</text>
    <text x="640" y="222" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#0F6E56">USB Gamepad</text>
    <text x="640" y="242" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#0F6E56">Graphics + Audio</text>
  </g>

  <!-- Arrows: Input to Core -->
  <line x1="180" y1="220" x2="240" y2="120" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="165" text-anchor="middle" font-size="12px" fill="#185FA5">Input</text>

  <!-- Arrows: Core to subsystems -->
  <line x1="285" y1="180" x2="285" y2="220" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12px" fill="#534AB7">Player</text>

  <line x1="340" y1="180" x2="395" y2="220" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="200" text-anchor="middle" font-size="12px" fill="#534AB7">Enemies</text>

  <line x1="380" y1="180" x2="505" y2="220" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="200" text-anchor="middle" font-size="12px" fill="#534AB7">Physics</text>

  <!-- Arrows: Subsystems to Shop/Levels -->
  <line x1="285" y1="310" x2="285" y2="340" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="395" y1="310" x2="395" y2="340" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrow: Core to Output -->
  <line x1="440" y1="120" x2="570" y2="220" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="165" text-anchor="middle" font-size="12px" fill="#0F6E56">USB HID</text>

</svg>
