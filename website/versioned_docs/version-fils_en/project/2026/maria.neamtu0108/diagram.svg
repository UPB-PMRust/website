<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Styles -->
  <style>
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2.5; rx: 10; }
    .box-mcu { fill: #e3f2fd; stroke: #0d47a1; stroke-width: 2.5; rx: 10; }
    .box-led { fill: #fff3e0; stroke: #e65100; stroke-width: 2.5; rx: 10; }
    .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #212529; text-anchor: middle; }
    .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #495057; text-anchor: middle; }
    .line { stroke: #2c3e50; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #d32f2f; font-weight: bold; }
  </style>

  <!-- Laptop Block -->
  <rect x="30" y="150" width="160" height="80" class="box" />
  <text x="110" y="190" class="text-title">Laptop</text>
  <text x="110" y="210" class="text-sub">(Power Source)</text>

  <!-- Microcontroller Block -->
  <rect x="300" y="150" width="200" height="80" class="box-mcu"/>
  <text x="400" y="185" class="text-title">Raspberry Pi Pico 2 W</text>
  <text x="400" y="210" class="text-sub">(Async Rust Firmware)</text>

  <!-- Mic Block -->
  <rect x="300" y="20" width="200" height="70" class="box" />
  <text x="400" y="50" class="text-title">MAX4466 Mic</text>
  <text x="400" y="70" class="text-sub">(Analog Audio Input)</text>

  <!-- LEDs Block -->
  <rect x="580" y="150" width="160" height="80" class="box-led" />
  <text x="660" y="190" class="text-title">4 x LEDs</text>
  <text x="660" y="210" class="text-sub">(Listening Indicator)</text>

  <!-- OLED Block -->
  <rect x="300" y="290" width="200" height="70" class="box" />
  <text x="400" y="320" class="text-title">SSD1306 OLED</text>
  <text x="400" y="340" class="text-sub">(Visual Output)</text>

  <!-- Connections -->
  <!-- Laptop to Pico -->
  <line x1="190" y1="190" x2="285" y2="190" class="line" />
  <text x="242" y="180" class="label" text-anchor="middle">Micro USB</text>

  <!-- Mic to Pico -->
  <line x1="400" y1="90" x2="400" y2="135" class="line" />
  <text x="430" y="118" class="label">ADC</text>

  <!-- Pico to LEDs -->
  <line x1="500" y1="190" x2="565" y2="190" class="line" />
  <text x="532" y="180" class="label" text-anchor="middle">GPIO</text>

  <!-- Pico to OLED -->
  <line x1="400" y1="230" x2="400" y2="275" class="line" />
  <text x="430" y="260" class="label">I2C</text>
</svg>
